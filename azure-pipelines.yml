trigger:
  branches:
    include:
      - main

variables:
  - group: terraform-deploy

stages:

- stage: Terraform_plan
  displayName: 'Terraform Plan & Backend Setup'
  jobs:
  - job: plan
    displayName: 'Plan job'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: DownloadSecureFile@1
      name: download_sa
      inputs:
        secureFile: $(SERVICE_ACCOUNT_SECUREFILE)

    - task: GoogleCloudSdkInstaller@0
      displayName: 'Install Google Cloud SDK'
      inputs:
        version: '457.0.0'

    - task: Bash@3
      displayName: 'Authenticate gcloud with service account'
      env:
        GOOGLE_APPLICATION_CREDENTIALS: $(Agent.TempDirectory)/$(SERVICE_ACCOUNT_SECUREFILE)
      inputs:
        targetType: 'inline'
        script: |
          set -euo pipefail
          echo "Using creds: $GOOGLE_APPLICATION_CREDENTIALS"
          gcloud --quiet auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project $(PROJECT_ID)
          gcloud --quiet config set compute/region $(LOCATION) || true
  

    - task: Bash@3
      displayName: 'Ensure GCS backend bucket exists (idempotent)'
      env:
        GOOGLE_APPLICATION_CREDENTIALS: $(Agent.TempDirectory)/$(SERVICE_ACCOUNT_SECUREFILE)
      inputs:
        targetType: 'inline'
        script: |
          set -euo pipefail
          if ! gsutil ls -b gs://$(GCS_BACKEND_BUCKET) >/dev/null 2>&1; then
            echo "Creating bucket: $(GCS_BACKEND_BUCKET)"
            gsutil mb -p $(PROJECT_ID) -l $(LOCATION) gs://$(GCS_BACKEND_BUCKET)
            gsutil versioning set on gs://$(GCS_BACKEND_BUCKET)
            echo "Bucket created and versioning enabled."
          else
            echo "Bucket exists; ensuring versioning on (idempotent)."
            gsutil versioning set on gs://$(GCS_BACKEND_BUCKET) || true
          fi

    # - task: Bash@3
    #   displayName: 'Install Terraform (CLI)'
    #   inputs:
    #     targetType: 'inline'
    #     script: |
    #       set -euo pipefail
    #       if ! command -v terraform >/dev/null 2>&1; then
    #         wget https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip -O /tmp/terraform.zip
    #         unzip -o /tmp/terraform.zip -d /usr/local/bin
    #       fi
    #       terraform version


    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'



    - task: Bash@3
      displayName: 'Terraform init & plan (writes plan file)'
      env:
        GOOGLE_APPLICATION_CREDENTIALS: $(Agent.TempDirectory)/$(SERVICE_ACCOUNT_SECUREFILE)
      inputs:
        targetType: 'inline'
        script: |
          set -euo pipefail
          export GCS_BACKEND_BUCKET="$(GCS_BACKEND_BUCKET)"
          export BUCKET_PREFIX="$(BUCKET_PREFIX)"
          export PROJECT_ID="$(PROJECT_ID)"
          export LOCATION="$(LOCATION)"
          export TERRAFORM_WORKING_DIR="$(TERRAFORM_WORKING_DIR)"

          cd "$TERRAFORM_WORKING_DIR"
          export TF_VAR_project_id="$PROJECT_ID"
          export TF_VAR_region="$LOCATION"
          terraform init -backend-config="bucket=$(GCS_BACKEND_BUCKET)" -backend-config="prefix=$(BUCKET_PREFIX)"
          terraform validate
          terraform plan -out=tfplan.binary -input=false
          terraform show -no-color tfplan.binary > tfplan.txt
              
    - publish: $(TERRAFORM_WORKING_DIR)/tfplan.binary
      artifact: tfplan
    - publish: $(TERRAFORM_WORKING_DIR)/tfplan.txt
      artifact: tfplan_txt

    - task: TerraformTask@5
      inputs:
        provider: 'gcp'
        command: 'init'
        backendServiceGCP: 'GCP-tf-service-acc'
        backendGCPBucketName: '$(GCS_BACKEND_BUCKET)'
        backendGCPPrefix: '$(BUCKET_PREFIX)'

    - task: TerraformTask@5
      inputs:
        provider: 'gcp'
        command: 'apply'
        workingDirectory: '$(TERRAFORM_WORKING_DIR)'
        commandOptions: '-input=false -auto-approve tfplan.binary'
        environmentServiceNameGCP: 'GCP-tf-service-acc'

    # - task: DownloadPipelineArtifact@2
    #   displayName: 'Download plan artifact'
    #   inputs:
    #     artifact: tfplan
    #     path: $(Build.SourcesDirectory)/$(TERRAFORM_WORKING_DIR)

    # - task: TerraformTask@5
    #   inputs:
    #     provider: 'gcp'
