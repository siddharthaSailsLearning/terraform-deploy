trigger:
  branches:
    include:
      - main

variables:
  - group: terraform-deploy
  # - name: name
  #   value: $(var)

stages:

- stage: BootstrapBackend
  displayName: 'Bootstrap: ensure GCS backend bucket exists'
  jobs:
  - job: Bootstrap
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: DownloadSecureFile@1
      name: download_sa
      inputs:
        secureFile: $(SERVICE_ACCOUNT_SECUREFILE)

    - task: Bash@3
      displayName: 'Install gcloud (bare minimum) and create backend bucket idempotent'
      env:
        GOOGLE_APPLICATION_CREDENTIALS: $(Agent.TempDirectory)/$(SERVICE_ACCOUNT_SECUREFILE)
      inputs:
        targetType: 'inline'
        script: |
          set -euo pipefail
          echo "PATH: $PATH"
          echo "Creds file: $GOOGLE_APPLICATION_CREDENTIALS"
          # Install gcloud non-interactively
          if ! command -v gcloud >/dev/null 2>&1; then
            curl -sSL https://sdk.cloud.google.com | bash >/dev/null 2>&1 || true
            export PATH="$HOME/google-cloud-sdk/bin:$PATH"
          fi
          gcloud --quiet version || true
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project $(PROJECT_ID)
          # create bucket if missing
          if ! gsutil ls -b gs://$(GCS_BACKEND_BUCKET) >/dev/null 2>&1; then
            echo "Creating bucket: $(GCS_BACKEND_BUCKET)"
            gsutil mb -p $(PROJECT_ID) -l $(LOCATION) gs://$(GCS_BACKEND_BUCKET)
            gsutil versioning set on gs://$(GCS_BACKEND_BUCKET)
            echo "Bucket created and versioning enabled."
          else
            echo "Bucket exists; setting versioning on (idempotent)."
            gsutil versioning set on gs://$(GCS_BACKEND_BUCKET) || true
          fi

- stage: TerraformPlan
  displayName: 'Terraform Plan (modules)'
  dependsOn: BootstrapBackend
  jobs:
  - job: Plan
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: DownloadSecureFile@1
      name: download_sa_plan
      inputs:
        secureFile: $(SERVICE_ACCOUNT_SECUREFILE)

    - task: Bash@3
      displayName: 'Install Terraform'
      inputs:
        targetType: 'inline'
        script: |
          set -euo pipefail
          if ! command -v terraform >/dev/null 2>&1; then
            wget https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip -O /tmp/terraform.zip
            unzip -o /tmp/terraform.zip -d /usr/local/bin
          fi
          terraform version

    - task: Bash@3
      displayName: 'Terraform init & plan (writes plan file)'
      env:
        GOOGLE_APPLICATION_CREDENTIALS: $(Agent.TempDirectory)/$(SERVICE_ACCOUNT_SECUREFILE)
      inputs:
        targetType: 'inline'
        script: |
          set -euo pipefail
          cd $(TERRAFORM_WORKING_DIR)
          export TF_VAR_project_id=$(PROJECT_ID)
          export TF_VAR_region=$(LOCATION)
          # ensure backend parameters passed to init for CI
          terraform init -backend-config="bucket=$(GCS_BACKEND_BUCKET)" -backend-config="prefix=$(BUCKET_PREFIX)"
          terraform validate
          terraform plan -out=tfplan.binary -input=false
          terraform show -no-color tfplan.binary > tfplan.txt
          echo "Plan written to tfplan.binary and tfplan.txt"

    - publish: $(TERRAFORM_WORKING_DIR)/tfplan.binary
      artifact: tfplan
    - publish: $(TERRAFORM_WORKING_DIR)/tfplan.txt
      artifact: tfplan_txt

- stage: ManualApproval
  displayName: 'Manual Approval Gate'
  dependsOn: TerraformPlan
  jobs:
  - job: manual_approval
    displayName: "Manual Approval"
    dependsOn: terraform_init
    pool: server
    steps:
    - task: ManualValidation@0
      timeoutInMinutes: 5
      inputs:
        instructions: "Hi, please validate"

- stage: TerraformApply
  displayName: 'Terraform Apply (modules)'
  dependsOn: ManualApproval
  jobs:
  - job: Apply
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: DownloadSecureFile@1
      name: download_sa_apply
      inputs:
        secureFile: $(SERVICE_ACCOUNT_SECUREFILE)

    - task: DownloadPipelineArtifact@2
      displayName: 'Download plan artifact'
      inputs:
        artifact: tfplan
        path: $(Build.SourcesDirectory)/$(TERRAFORM_WORKING_DIR)

    - task: Bash@3
      displayName: 'Install Terraform (if missing)'
      inputs:
        targetType: 'inline'
        script: |
          set -euo pipefail
          if ! command -v terraform >/dev/null 2>&1; then
            wget https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip -O /tmp/terraform.zip
            unzip -o /tmp/terraform.zip -d /usr/local/bin
          fi
          terraform version

    - task: Bash@3
      displayName: 'Terraform init & apply (use binary plan)'
      env:
        GOOGLE_APPLICATION_CREDENTIALS: $(Agent.TempDirectory)/$(SERVICE_ACCOUNT_SECUREFILE)
      inputs:
        targetType: 'inline'
        script: |
          set -euo pipefail
          cd $(TERRAFORM_WORKING_DIR)
          export TF_VAR_project_id=$(PROJECT_ID)
          export TF_VAR_region=$(LOCATION)
          terraform init -backend-config="bucket=$(GCS_BACKEND_BUCKET)" -backend-config="prefix=$(BUCKET_PREFIX)"
          # apply saved binary plan
          if [ -f tfplan.binary ]; then
            terraform apply -input=false -auto-approve tfplan.binary
          else
            echo "tfplan.binary missing — running interactive apply (should not happen in CI)."
            terraform apply -input=false -auto-approve
          fi
